name: MineSttr Auto Control (API Version)

on:
  workflow_dispatch:  # 👈 只保留手动触发，核心控制权完全交给 cron-job.org

jobs:
  control-server:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
      
      - name: 🛡️ 启动 GOST 代理转发 (保障网络畅通)
        if: ${{ env.GOST_PROXY != '' }}
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
        run: |
          VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
          chmod +x gost
          nohup ./gost -L http://:8080 -F "$GOST_PROXY" > gost.log 2>&1 &
          sleep 3

      - name: ⚡ 执行服务器控制脚本
        env:
          # 巧妙映射：用你现有的 Secrets 给脚本的环境变量赋值
          API_KEY: ${{ secrets.MINESTRATOR_AUTH }}
          SERVER_ID: ${{ secrets.MINESTRATOR_SERVER_ID }}
          ACTION: "restart"                     # 🎯 直接指定动作为重启
          PROXY: "http://127.0.0.1:8080"        # 🌐 指向刚启动的本地 GOST 代理
        run: |
          chmod +x mine_control.sh
          ./mine_control.sh
