name: Minestrator-Restart
on:
  workflow_dispatch:
  
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOST_PROXY: ${{ secrets.GOST_PROXY }}
      
    steps:
      - name: 📥 拉取本库代码
        uses: actions/checkout@v4
        
      - name: 🛡️ 启动 GOST 代理转发
        if: ${{ env.GOST_PROXY != '' }}
        run: |
          echo "🛡️ 使用代理模式"
          echo "🌐 验证出口IP..."
          VERSION=$(curl -s https://api.github.com/repos/ginuerzh/gost/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          wget -q "https://github.com/ginuerzh/gost/releases/download/v${VERSION}/gost_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "gost_${VERSION}_linux_amd64.tar.gz"
          chmod +x gost
          nohup ./gost -L http://:8080 -F "$GOST_PROXY" > gost.log 2>&1 &
          sleep 3
          IP_RAW=$(curl -s -x http://127.0.0.1:8080 "https://api.ipify.org?format=json" | grep -o '"ip":"[^"]*"' | cut -d'"' -f4)
          IP_MASKED=$(echo "$IP_RAW" | sed 's/\([0-9]*\.[0-9]*\.\).*/\1**.**/')
          echo "✅ 出口IP确认：$IP_MASKED"
          
      - name: 🔧 执行 API 重启脚本
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          # 确保这俩 Secrets 在 GitHub 仓库设置里已经填好
          MINESTRATOR_APIKEY: ${{ secrets.MINESTRATOR_AUTH }} 
          SERVER_ID: ${{ secrets.MINESTRATOR_SERVER_ID }}
        run: |
          chmod +x minestrator_restart.sh
          bash minestrator_restart.sh
