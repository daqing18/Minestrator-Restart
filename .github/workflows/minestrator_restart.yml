name: Minestrator-Restart

on:
  workflow_dispatch:
  
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_LINK: ${{ secrets.PROXY_NODE }}
      
    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Minestrator-Restart-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          
      - name: 📂 复制脚本到工作目录
        run: cp private/minestrator_restart.sh minestrator_restart.sh
        
      - name: ⚡ 启动 sing-box 代理
        run: |
          echo "🌐 正在解析分享链接并启动 sing-box..."
          # 确保脚本正确执行并把输出打印出来
          if [ -z "$NODE_LINK" ]; then
            echo "❌ 错误：未检测到 PROXY_NODE 密钥！请检查 GitHub Secrets。"
            exit 1
          fi
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          
      - name: 🔍 诊断 sing-box 状态与端口
        run: |
          echo "📊 检查本地监听端口 8080:"
          sleep 2
          netstat -tuln | grep 8080 || ss -tuln | grep 8080 || echo "⚠️ 8080 端口未监听！"
          
      - name: 🔧 执行重启脚本 (必须走代理)
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          MINESTRATOR_APIKEY: ${{ secrets.MINESTRATOR_AUTH }}
          GOST_PROXY: "true"
        run: bash minestrator_restart.sh
