Name: Minestrator-Restart
on:
  workflow_dispatch:
  
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_LINK: ${{ secrets.PROXY_NODE }}
      
    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Minestrator-Restart-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          
      - name: 📂 复制脚本到工作目录
        run: cp private/minestrator_restart.sh minestrator_restart.sh
        
      - name: ⚡ 设置代理 (基于 sing-box，支持所有主流协议)
        continue-on-error: true
        run: |
          echo "🌐 正在解析分享链接并启动 sing-box 代理..."
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          
      - name: 🌐 验证代理出口IP
        run: |
          echo "🌐 检查当前出口IP..."
          IP_RAW=$(curl -s -x http://127.0.0.1:8080 "https://api.ipify.org?format=json" | grep -o '"ip":"[^"]*"' | cut -d'"' -f4)
          if [ -n "$IP_RAW" ]; then
            IP_MASKED=$(echo "$IP_RAW" | sed 's/\([0-9]*\.[0-9]*\.\).*/\1**.**/')
            echo "✅ 代理启动成功，出口IP: $IP_MASKED"
          else
            echo "⚠️ 未能通过代理获取IP"
          fi
          
      - name: 🔧 执行重启脚本
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          MINESTRATOR_APIKEY: ${{ secrets.MINESTRATOR_APIKEY }}
          GOST_PROXY: "true"
        run: bash minestrator_restart.sh
