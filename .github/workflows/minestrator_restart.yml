      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS=$(gh run list --repo "${{ github.repository }}" --workflow="Minestrator-Restart" --limit=200 --json databaseId --jq '.[].databaseId')
          COUNT=0
          DELETED=0
          FAILED=0
          for RUN_ID in $RUNS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt 1 ]; then
              echo "删除运行记录: $RUN_ID"
              if gh run delete --repo "${{ github.repository }}" "$RUN_ID" 2>&1; then
                DELETED=$((DELETED + 1))
              else
                FAILED=$((FAILED + 1))
                echo "⚠️ 删除失败: $RUN_ID"
              fi
              sleep 0.3
            fi
          done
          echo "共处理 ${COUNT} 条，成功删除 ${DELETED} 条，失败 ${FAILED} 条"
