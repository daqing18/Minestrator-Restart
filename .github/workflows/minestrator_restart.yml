name: Minestrator-Restart
on:
  workflow_dispatch:
  
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_LINK: ${{ secrets.NODE_LINK }}
      
    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Minestrator-Restart-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          
      - name: 📂 复制脚本到工作目录
        run: cp private/minestrator_restart.sh minestrator_restart.sh
        
      - name: 🌐 设置代理 (sing-box)
        if: ${{ env.NODE_LINK != '' }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          
      - name: 🔧 执行重启脚本
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          MINESTRATOR_APIKEY: ${{ secrets.MINESTRATOR_APIKEY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }} # 接收 setup_proxy.sh 导出的代理地址
        run: bash minestrator_restart.sh

      - name: 🧽 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log
