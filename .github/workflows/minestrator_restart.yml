name: Minestrator-Restart
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_LINK: ${{ secrets.NODE_LINK }}

    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Minestrator-Restart-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 复制脚本到工作目录
        run: cp private/minestrator_restart.sh minestrator_restart.sh

      - name: 🌐 设置代理 (sing-box)
        if: ${{ env.NODE_LINK != '' }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🔧 执行重启脚本
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          MINESTRATOR_APIKEY: ${{ secrets.MINESTRATOR_APIKEY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: bash minestrator_restart.sh

      - name: 🧽 清理代理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOW_FILE="Minestrator-Restart"
          PAGES=1
          COUNT=0
          DELETED=0

          while [ $PAGES -le 5 ]; do
            RESPONSE=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100&page=${PAGES}")

            RUN_IDS=$(echo "$RESPONSE" | jq -r '.workflow_runs[].id // empty')
            TOTAL=$(echo "$RESPONSE" | jq '.total_count')

            if [ -z "$RUN_IDS" ]; then
              break
            fi

            for RUN_ID in $RUN_IDS; do
              COUNT=$((COUNT + 1))
              if [ $COUNT -gt 1 ]; then
                CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/runs/${RUN_ID}")
                if [ "$CODE" = "204" ] || [ "$CODE" = "202" ]; then
                  DELETED=$((DELETED + 1))
                fi
                sleep 0.2
              fi
            done

            if [ "$TOTAL" -le $COUNT ]; then
              break
            fi

            PAGES=$((PAGES + 1))
          done

          echo "共找到 ${COUNT} 条记录，删除 ${DELETED} 条，保留最新 1 条"
