name: Minestrator-Restart

on:
  workflow_dispatch:
  
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_LINK: ${{ secrets.PROXY_NODE }}
      
    steps:
      - name: 📥 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Minestrator-Restart-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private
          
      - name: 📂 复制脚本到工作目录
        run: cp private/minestrator_restart.sh minestrator_restart.sh
        
      - name: ⚡ 启动 sing-box 代理
        run: |
          echo "🌐 正在解析分享链接并启动 sing-box..."
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
          
      - name: 🔍 诊断 sing-box 状态与日志
        run: |
          echo "📊 检查本地监听端口 8080:"
          nc -zvw3 127.0.0.1 8080 || echo "⚠️ 8080 端口未监听！"
          
          if [ -f "singbox.log" ]; then
            echo "📄 singbox.log 内容:"
            cat singbox.log
          else
            echo "⚠️ 未找到 singbox.log 文件"
          fi
          
      - name: 🔧 执行重启脚本 (必须走代理)
        env:
          TG_BOT: ${{ secrets.TG_BOT }}
          MINESTRATOR_APIKEY: ${{ secrets.MINESTRATOR_AUTH }}
          GOST_PROXY: "true"
        run: bash minestrator_restart.sh
